# This EC2 instance serves strikerrx.com. TLS is required before installation.
ProxyRequests Off
ProxyPass /api/ http://127.0.0.1:8001/api/ connectiontimeout=5 timeout=90
ProxyPassReverse /api/ http://127.0.0.1:8001/api/
<Location /api/>
    LimitRequestBody 3145728
    RequestHeader unset X-Forwarded-For
</Location>
